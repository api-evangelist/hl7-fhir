- aid: hl7-fhir:hl7-fhir-r5-api
  name: HL7 FHIR R5 Healthcare API
  description: >-
    HL7 FHIR R5 (Release 5) is the current published FHIR standard for healthcare data exchange. FHIR
    R5 REST APIs provide access to patient demographics, observations, conditions, medications, encounters,
    and care plans in both JSON and XML formats across EHR systems, published March 2023.
