aid: hl7-fhir
name: HL7 FHIR
description: >-
  HL7 FHIR (Fast Healthcare Interoperability Resources) is the standard API specification for healthcare data exchange,
  published by Health Level Seven International (HL7). FHIR REST APIs provide access to patient, clinical, financial,
  and administrative healthcare data in JSON, XML, and RDF formats with a CC0 open license.
