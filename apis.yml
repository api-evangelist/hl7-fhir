- aid: hl7-fhir:hl7-smart-on-fhir-api
  name: SMART on FHIR Authentication
  description: >-
    SMART on FHIR (v2.2.0) defines OAuth 2.0-based authorization patterns for client applications to authorize,
    authenticate, and integrate with FHIR-based data systems. It enables EHR launch, standalone launch,
    and backend service authorization workflows.
  humanURL: http://hl7.org/fhir/smart-app-launch/ImplementationGuide/hl7.fhir.uv.smart-app-launch
